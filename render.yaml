services:
  - type: web
    name: nina-automation
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/automation-status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CREDENTIALS_KEY
        sync: false
